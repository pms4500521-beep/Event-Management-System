<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System - Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- supabase connect karanna -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-700 to-indigo-900 flex items-center justify-center p-4">

    <!-- mada thiyena sudu login kotuwa -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">

        <!-- uda nama saha logo eka -->
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🎫</div>
            <h1 class="text-2xl font-bold text-gray-800">
                Event Management System
            </h1>
            <p class="text-gray-500 mt-2">
                Login to your account
            </p>
        </div>

        <!-- login form eka -->
        <form id="loginForm" class="space-y-5">

            <!-- email hari id hari gahana kotuwa -->
            <div>
                <label for="emailOrId" class="block text-sm font-semibold text-gray-700 mb-2">
                    Email Address / ID
                </label>
                <input
                    type="text"
                    id="emailOrId"
                    name="emailOrId"
                    required
                    autocomplete="username"
                    placeholder="Enter your email or ID"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >
            </div>

            <!-- password gahana kotuwa -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                    Password
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                    >

                    <!-- password eka penna/hanganna as deke button eka -->
                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 hover:text-gray-700 focus:outline-none"
                    >
                        <!-- arunu asa -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- wahunu asa -->
                        <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.962 8.962 0 012.122-.063c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21f-9 9 0 00-9-9m0 0L3 3" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- waradunoth rathu patin error eka watena thana -->
            <div
                id="errorMessage"
                class="hidden bg-red-100 text-red-700 p-3 rounded-lg text-sm"
                role="alert"
            ></div>

            <!-- login button eka -->
            <button
                type="submit"
                id="loginBtn"
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 active:scale-95 transition duration-200 font-semibold shadow-md"
            >
                Login
            </button>

        </form>

        <!-- yata footer eka -->
        <div class="text-center mt-8 text-sm text-gray-500">
            <p>Event Management System</p>
            <p class="mt-1">Secure Portal Access</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
